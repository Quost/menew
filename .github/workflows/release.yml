name: Release

# Ao subir uma tag vX.Y.Z: compila o app universal, assina e notariza (se os
# secrets existirem), gera Menew.dmg e Menew.zip e publica uma Release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    # macOS 26 com o Xcode 27 escolhido abaixo (SDK do macOS 27). Enquanto a imagem do GitHub não tem o Xcode 27, a
    # variável RELEASE_RUNNER do repositório aponta para o Mac do autor (["self-hosted","macOS","menew-release"]).
    # Só vai para o Mac quem está em SELF_HOSTED_AUTHORS (ex.: "Quost"); os demais ficam no GitHub.
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER != '' && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.RELEASE_RUNNER || '"macos-26"') }}
    # Uma release por vez, sem cancelar a que está no meio (assinar/notarizar pela metade deixa a Release torta)
    concurrency:
      group: release
      cancel-in-progress: false
    # A notarização sozinha pode levar até 2 h (--timeout 2h abaixo)
    timeout-minutes: 180
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão a partir da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag inválida: $GITHUB_REF_NAME (esperado vX.Y.Z)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # No repositório oficial, secret faltando (expirado, renomeado) não pode virar release sem assinatura
      # (forks continuam podendo compilar sem assinatura)
      - name: Exigir assinatura no repositório oficial
        if: github.repository == 'Quost/menew'
        run: |
          missing=""
          [ "$HAS_CERT" = "true" ] || missing="$missing DEVELOPER_ID_P12"
          [ "$HAS_NOTARY" = "true" ] || missing="$missing APPLE_ID"
          [ "$HAS_SPARKLE" = "true" ] || missing="$missing SPARKLE_PRIVATE_KEY"
          if [ -n "$missing" ]; then echo "::error::Secrets ausentes:$missing. Não publico release sem assinatura."; exit 1; fi

      - name: Importar certificado Developer ID
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          # A lista de chaves de antes, para o passo final devolver (num Mac de verdade ela não some com a máquina)
          echo "KC_FILE=$KC" >> "$GITHUB_ENV"
          echo "KC_BEFORE=$(security list-keychains -d user | tr -d '"' | xargs)" >> "$GITHUB_ENV"
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # O SDK do macOS 27 é obrigatório: compilada com o Xcode 26, a extensão de widgets cai ao abrir no macOS 27
      # (fica fora da galeria de widgets). Sem o Xcode 27 na imagem, para aqui em vez de publicar widgets quebrados.
      # Só neste job (DEVELOPER_DIR), sem sudo e sem trocar o Xcode padrão de um Mac de verdade
      - name: Xcode 27
        run: |
          X=""
          for c in $(ls -d /Applications/Xcode_27*.app /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            if "$c/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | grep -q '^Xcode 27'; then X="$c"; break; fi
          done
          [ -n "$X" ] || { echo "::error::Xcode 27 não está nesta máquina"; ls -d /Applications/Xcode*.app; exit 1; }
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$X/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Compilar
        run: UNIVERSAL=1 ./build.sh --dmg

      - name: Notarizar
        if: env.SIGN_IDENTITY != '' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit build/Menew.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 2h
          # O stapler baixa o selo da Apple; quedas de rede passageiras acontecem, então tenta de novo
          for i in 1 2 3 4 5; do
            xcrun stapler staple build/Menew.dmg && break
            [ "$i" = 5 ] && exit 1
            echo "Nova tentativa em $((i * 15))s…"; sleep $((i * 15))
          done
          for i in 1 2 3 4 5; do
            xcrun stapler staple build/Menew.app && break
            [ "$i" = 5 ] && exit 1
            echo "Nova tentativa em $((i * 15))s…"; sleep $((i * 15))
          done
          # Confere os selos e o Gatekeeper antes de zipar e publicar
          xcrun stapler validate build/Menew.app
          xcrun stapler validate build/Menew.dmg
          spctl -a -t exec -vv build/Menew.app

      - name: Zip
        run: ditto -c -k --keepParent build/Menew.app build/Menew.zip

      # Feed do Sparkle: o app consulta releases/latest/download/appcast.xml
      - name: Appcast (atualização automática)
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$KEY"' EXIT
          (umask 077; printf '%s' "$SPARKLE_KEY" > "$KEY")
          SIG=$(.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$KEY" build/Menew.zip)
          scripts/appcast.sh "$VERSION" "$GITHUB_REF_NAME" "$(git rev-list --count HEAD)" "$SIG" > build/appcast.xml
          cat build/appcast.xml

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE=""
          if [ -z "$SIGN_IDENTITY" ]; then
            NOTE=$'> **Build sem assinatura da Apple.** Na primeira vez, clique com o botão direito no Menew e escolha **Abrir**.\n\n'
          fi
          ASSETS=(build/Menew.dmg build/Menew.zip)
          [ -f build/appcast.xml ] && ASSETS+=(build/appcast.xml)
          # Notas: seção da versão no CHANGELOG.md + lista automática de mudanças
          CHANGES=$(awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md)
          [ -n "$(printf '%s' "$CHANGES" | tr -d '[:space:]')" ] || { echo "::error::CHANGELOG.md não tem a seção '## $VERSION' (ou ela está vazia)"; exit 1; }
          CHANGES+=$'\n\n☕ Menew is free and made in spare time. If it helps you, [buy me a coffee](https://buymeacoffee.com/quost).'
          # A API do GitHub às vezes falha (502, resposta vazia) depois de já ter criado a release:
          # tenta de novo e, se ela já existe, só substitui os arquivos. Assim rodar de novo também funciona.
          for i in 1 2 3 4; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber && break
            else
              gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
                --title "Menew $VERSION" --notes "$NOTE$CHANGES" --generate-notes && break
            fi
            [ "$i" = 4 ] && exit 1
            echo "Nova tentativa em $((i * 10))s…"; sleep $((i * 10))
          done

      # Mantém Casks/menew.rb (tap do Homebrew neste repo) na versão nova.
      # Sem deploy key, o commit vai pela API do GitHub, que o assina: aparece como "Verified".
      # Com RELEASE_DEPLOY_KEY (escrita só neste repositório), vai por git com ela: a main é protegida (PR, checks,
      # assinatura) e, numa conta pessoal, só deploy keys passam por essa proteção.
      - name: Atualizar Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          SHA256=$(shasum -a 256 build/Menew.dmg | cut -d' ' -f1)
          if [ -n "$DEPLOY_KEY" ]; then
            key="$RUNNER_TEMP/deploy_key"; (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$key")
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            REMOTE="git@github.com:$GITHUB_REPOSITORY.git"
            WT="$RUNNER_TEMP/menew-main"
            for i in 1 2 3 4; do
              ok=""
              rm -rf "$WT"; git worktree prune
              if git fetch -q "$REMOTE" main && git worktree add -q --detach "$WT" FETCH_HEAD; then
                sed -E -i '' "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 .*/  sha256 \"$SHA256\"/" "$WT/Casks/menew.rb"
                if git -C "$WT" diff --quiet; then ok=1
                elif git -C "$WT" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                       commit -qam "chore(homebrew): bump cask to $VERSION" &&
                     git -C "$WT" push -q "$REMOTE" HEAD:main; then ok=1
                fi
                git worktree remove -f "$WT" || true
              fi
              [ -n "$ok" ] && { rm -f "$key"; exit 0; }
              [ "$i" = 4 ] && { rm -f "$key"; exit 1; }
              echo "Nova tentativa em $((i * 10))s…"; sleep $((i * 10))
            done
          fi
          API="repos/$GITHUB_REPOSITORY/contents/Casks/menew.rb"
          # Lê de novo a cada tentativa: se a anterior gravou e só a resposta se perdeu, não há o que fazer
          for i in 1 2 3 4; do
            if BLOB=$(gh api "$API?ref=main" --jq .sha) &&
               gh api "$API?ref=main" --jq .content | base64 --decode > "$RUNNER_TEMP/menew.old.rb"; then
              sed -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 .*/  sha256 \"$SHA256\"/" \
                "$RUNNER_TEMP/menew.old.rb" > "$RUNNER_TEMP/menew.rb"
              if cmp -s "$RUNNER_TEMP/menew.old.rb" "$RUNNER_TEMP/menew.rb"; then exit 0; fi
              gh api -X PUT "$API" \
                -f message="chore(homebrew): bump cask to $VERSION" \
                -f content="$(base64 < "$RUNNER_TEMP/menew.rb" | tr -d '\n')" \
                -f sha="$BLOB" -f branch=main --jq '.commit.html_url' && exit 0
            fi
            [ "$i" = 4 ] && exit 1
            echo "Nova tentativa em $((i * 10))s…"; sleep $((i * 10))
          done

      # Sempre, mesmo se algo falhou: apaga o keychain temporário e devolve a lista de chaves de antes
      - name: Limpar keychain
        if: always() && env.KC_FILE != ''
        run: |
          security list-keychains -d user -s $KC_BEFORE
          security delete-keychain "$KC_FILE" 2>/dev/null || true
