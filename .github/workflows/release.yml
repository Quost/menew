name: Release

# Ao subir uma tag vX.Y.Z: compila o app universal, assina e notariza (se os
# secrets existirem), gera Menew.dmg e Menew.zip e publica uma Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
      HAS_SPARKLE: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão a partir da tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Importar certificado Developer ID
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Compilar
        run: UNIVERSAL=1 ./build.sh --dmg

      - name: Notarizar
        if: env.SIGN_IDENTITY != '' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit build/Menew.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 2h
          xcrun stapler staple build/Menew.dmg
          xcrun stapler staple build/Menew.app || true

      - name: Zip
        run: ditto -c -k --keepParent build/Menew.app build/Menew.zip

      # Feed do Sparkle: o app consulta releases/latest/download/appcast.xml
      - name: Appcast (atualização automática)
        if: env.HAS_SPARKLE == 'true'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_KEY" > "$KEY"
          SIG=$(.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$KEY" build/Menew.zip)
          rm "$KEY"
          scripts/appcast.sh "$VERSION" "$GITHUB_REF_NAME" "$(git rev-list --count HEAD)" "$SIG" > build/appcast.xml
          cat build/appcast.xml

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE=""
          if [ -z "$SIGN_IDENTITY" ]; then
            NOTE=$'> **Build sem assinatura da Apple.** Na primeira vez, clique com o botão direito no Menew e escolha **Abrir**.\n\n'
          fi
          ASSETS=(build/Menew.dmg build/Menew.zip)
          [ -f build/appcast.xml ] && ASSETS+=(build/appcast.xml)
          # Notas: seção da versão no CHANGELOG.md + lista automática de mudanças
          CHANGES=$(awk -v v="$VERSION" '/^## /{p = ($2 == v); next} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --title "Menew $VERSION" --notes "$NOTE$CHANGES" --generate-notes

      # Mantém Casks/menew.rb (tap do Homebrew neste repo) na versão nova
      - name: Atualizar Homebrew
        run: |
          SHA=$(shasum -a 256 build/Menew.dmg | cut -d' ' -f1)
          git fetch -q origin main
          git checkout -q -B main origin/main
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 .*/  sha256 \"$SHA\"/" Casks/menew.rb
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Homebrew: Menew $VERSION"
          git push -q origin main
