name: Dependabot auto-merge

# Atualizações patch e minor do Dependabot entram sozinhas quando os checks obrigatórios passam (o main é protegido).
# Major, e minor de versões 0.x, esperam uma pessoa.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Antes da 1.0, uma minor pode quebrar a API (semver): 0.32 → 0.43 espera uma pessoa, como as major.
      - name: Merge once the required checks pass
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          risky=$(jq '[.[] | select(.updateType == "version-update:semver-major"
            or (.updateType == "version-update:semver-minor" and ((.prevVersion // "0.") | startswith("0."))))] | length' <<<"$DEPS")
          if [ "$risky" -gt 0 ]; then echo "Major, ou minor de uma versão 0.x: espera uma pessoa."; exit 0; fi
          # O Sparkle instala as atualizações de todos os usuários e o CI não exercita o atualizador: sempre uma pessoa
          if jq -e 'any(.[]; .dependencyName | ascii_downcase | contains("sparkle"))' <<<"$DEPS" >/dev/null; then
            echo "Sparkle: espera uma pessoa."; exit 0
          fi
          gh pr merge --auto --squash "$PR"
