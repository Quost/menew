name: CI

# Em todo pull request (e em cada push na main): compila o app como na Release, roda os testes,
# confere as traduções e se as páginas do site foram geradas. As mensagens de commit ficam no commitlint.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Onde roda: a variável CI_RUNNER do repositório (ex.: ["self-hosted","macOS","menew-release"]) leva os jobs para o
# Mac do autor; vazia, ficam nas máquinas do GitHub. PR vindo de fork nunca roda no Mac, e com SELF_HOSTED_AUTHORS
# (ex.: "Quost" ou "Quost,outra-pessoa") só quem disparou e o autor do PR que estão na lista.
jobs:
  app:
    name: Build and tests
    # macOS 26 traz o Xcode 26, o mesmo da Release
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"macos-26"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compilar o app (como na Release, assinatura ad-hoc)
        run: ./build.sh
      - name: Testes
        run: swift test

  translations:
    name: Translations and changelog
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # as tags: toda versão publicada precisa da sua seção no CHANGELOG
      # Todo L("…") precisa de en, de, es e zh em L10n.swift; chave repetida derruba o app ao abrir
      - run: python3 scripts/check-l10n.py
      # O CHANGELOG vira as notas de cada versão: uma seção por versão, na ordem
      - run: python3 scripts/check-changelog.py

  site:
    name: Website pages
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a data de atualização vem do histórico (scripts/build-site.py)
      # docs/ é gerado a partir de site/. As linhas de data mudam com qualquer commit no CHANGELOG, então não contam aqui.
      - name: Conferir páginas geradas
        run: |
          python3 scripts/build-site.py
          git diff --exit-code -I '<lastmod>' -I 'dateModified' -I 'updated 20[0-9]' -- docs \
            || { echo "::error::Rode python3 scripts/build-site.py e faça commit de docs/"; exit 1; }
