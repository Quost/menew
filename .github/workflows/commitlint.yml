name: Commits

# Confere se os commits seguem o padrão Conventional Commits. Em PR, o título também:
# os PRs entram por squash, e o título vira o commit no main.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# Onde roda: a variável CI_RUNNER do repositório (ex.: ["self-hosted","macOS","menew-release"]) leva os jobs para o
# Mac do autor; vazia, ficam nas máquinas do GitHub. PR vindo de fork nunca roda no Mac, e com SELF_HOSTED_AUTHORS
# (ex.: "Quost" ou "Quost,outra-pessoa") só quem disparou e o autor do PR que estão na lista.
jobs:
  commitlint:
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pelo npm (e não por uma action em Docker) para rodar também num Mac
      - name: Mensagens dos commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          npm install --no-save --silent @commitlint/cli@19 @commitlint/config-conventional@19
          if [ "$EVENT" = pull_request ]; then FROM="$PR_BASE"; TO="$PR_HEAD"; else FROM="$PUSH_BEFORE"; TO="$PUSH_SHA"; fi
          # Primeiro push de um branch: não há "antes", confere só o último commit
          if [ -z "$FROM" ] || [ "$FROM" = 0000000000000000000000000000000000000000 ]; then FROM="$TO~1"; fi
          npx --no-install commitlint --from "$FROM" --to "$TO" --verbose

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Título do PR
        # Pelo env, nunca direto no script: o título vem de quem abriu o PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm install --no-save --silent @commitlint/cli@19 @commitlint/config-conventional@19
          printf '%s\n' "$TITLE" | npx --no-install commitlint \
            || { echo "::error::O título do PR vira o commit no main: use o padrão, ex.: fix(clipboard): …"; exit 1; }
