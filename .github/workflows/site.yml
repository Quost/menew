name: Site

# Publica docs/ no Firebase Hosting (site menew-pururucos, https://menew.pururucos.com.br) a cada push na main que mexa no site.
# O site antigo (menew, https://menew.web.app) só redireciona (301) cada caminho para o mesmo caminho no domínio novo.
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "scripts/build-site.py", "hosting-redirect/**", "firebase.json", ".firebaserc", ".github/workflows/site.yml"]
  workflow_dispatch:
  # A página /linux vem do repositório menew-linux: lá, um workflow dispara este evento a cada release publicada
  # e a cada mudança em site/ ou docs/assets/ da main (Quost/menew-linux, .github/workflows/site-sync.yml)
  repository_dispatch:
    types: [menew-linux-site]

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

# Onde roda: a variável CI_RUNNER do repositório (ex.: ["self-hosted","macOS","menew-release"]) leva os jobs para o
# Mac do autor; vazia, ficam nas máquinas do GitHub. PR vindo de fork nunca roda no Mac, e com SELF_HOSTED_AUTHORS
# (ex.: "Quost" ou "Quost,outra-pessoa") só quem disparou e o autor do PR que estão na lista.
jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Só roda depois que a credencial do Firebase for cadastrada
    if: ${{ vars.FIREBASE_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a data de atualização do site vem do histórico (scripts/build-site.py)
      # As páginas de docs/ são geradas a partir de site/; não publica se estiverem desatualizadas.
      # A página /linux (docs/linux, docs/*/linux e docs/assets/linux) fica fora do git: o build a gera aqui,
      # com um clone raso da main do menew-linux, e o deploy publica o que estiver em docs/ depois do build.
      - name: Conferir páginas geradas
        run: |
          python3 scripts/build-site.py
          git diff --exit-code -- docs || { echo "::error::Rode python3 scripts/build-site.py e faça commit"; exit 1; }
      # Conteúdo: alvo "menew" = site menew-pururucos (menew.pururucos.com.br), pasta docs/
      - name: Publicar site (menew.pururucos.com.br)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MENEW_PRD }}
          projectId: menew-prd
          target: menew
          channelId: live
      # Endereço antigo: alvo "menew-legacy" = site menew (menew.web.app), só redirecionamentos 301 (hosting-redirect/)
      - name: Publicar redirecionamento (menew.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MENEW_PRD }}
          projectId: menew-prd
          target: menew-legacy
          channelId: live
      # Site padrão do projeto (menew-prd.web.app): mesmo redirecionamento, alvo próprio (o Firebase aceita um site por alvo)
      - name: Publicar redirecionamento (menew-prd.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MENEW_PRD }}
          projectId: menew-prd
          target: menew-legacy-prd
          channelId: live

      # IndexNow: avisa o Bing (e Yandex, Naver, Seznam…) que o site mudou, para reindexar em horas em vez de semanas.
      # O Bing alimenta a busca do ChatGPT. A chave é pública por definição (fica em docs/df850856e8360dcdd128c85eb1c159fd.txt, servida em https://menew.pururucos.com.br/df850856e8360dcdd128c85eb1c159fd.txt).
      - name: Avisar buscadores (IndexNow)
        run: |
          curl -s -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"menew.pururucos.com.br","key":"df850856e8360dcdd128c85eb1c159fd","keyLocation":"https://menew.pururucos.com.br/df850856e8360dcdd128c85eb1c159fd.txt","urlList":["https://menew.pururucos.com.br/","https://menew.pururucos.com.br/pt","https://menew.pururucos.com.br/de","https://menew.pururucos.com.br/es","https://menew.pururucos.com.br/zh","https://menew.pururucos.com.br/mac","https://menew.pururucos.com.br/pt/mac","https://menew.pururucos.com.br/llms.txt","https://menew.pururucos.com.br/sitemap.xml"]}' || true
