name: Site

# Publica docs/ no Firebase Hosting (menew.web.app) a cada push na main que mexa no site.
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "scripts/build-site.py", "firebase.json", ".firebaserc", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

# Onde roda: a variável CI_RUNNER do repositório (ex.: ["self-hosted","macOS","menew-release"]) leva os jobs para o
# Mac do autor; vazia, ficam nas máquinas do GitHub. PR vindo de fork nunca roda no Mac.
jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Só roda depois que a credencial do Firebase for cadastrada
    if: ${{ vars.FIREBASE_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a data de atualização do site vem do histórico (scripts/build-site.py)
      # As páginas de docs/ são geradas a partir de site/; não publica se estiverem desatualizadas
      - name: Conferir páginas geradas
        run: |
          python3 scripts/build-site.py
          git diff --exit-code -- docs || { echo "::error::Rode python3 scripts/build-site.py e faça commit"; exit 1; }
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MENEW_PRD }}
          projectId: menew-prd
          target: menew
          channelId: live

      # IndexNow: avisa o Bing (e Yandex, Naver, Seznam…) que o site mudou, para reindexar em horas em vez de semanas.
      # O Bing alimenta a busca do ChatGPT. A chave é pública por definição (fica em docs/df850856e8360dcdd128c85eb1c159fd.txt).
      - name: Avisar buscadores (IndexNow)
        run: |
          curl -s -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"menew.web.app","key":"df850856e8360dcdd128c85eb1c159fd","keyLocation":"https://menew.web.app/df850856e8360dcdd128c85eb1c159fd.txt","urlList":["https://menew.web.app/","https://menew.web.app/pt","https://menew.web.app/de","https://menew.web.app/es","https://menew.web.app/zh","https://menew.web.app/llms.txt","https://menew.web.app/sitemap.xml"]}' || true
