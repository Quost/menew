name: CodeQL

# Análise de segurança do código. Substitui o "default setup" do GitHub, que rodava o Swift (no macOS, ~18 min)
# em todo push e pull request: em poucos dias isso somou ~20 h de macOS e a conta caiu num bloqueio do Actions.
# Agora as linguagens leves (Linux, ~1 min) rodam a cada mudança; o Swift roda uma vez por semana, antes de cada
# release (tag) e quando você pedir (Actions › CodeQL › Run workflow). As categorias são as mesmas de antes,
# então os alertas abertos continuam.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # segunda, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Onde roda: a variável CI_RUNNER do repositório (ex.: ["self-hosted","macOS","menew-release"]) leva os jobs para o
# Mac do autor; vazia, ficam nas máquinas do GitHub. PR vindo de fork nunca roda no Mac, e com SELF_HOSTED_AUTHORS
# (ex.: "Quost" ou "Quost,outra-pessoa") só quem disparou e o autor do PR que estão na lista.
jobs:
  light:
    name: Analyze (${{ matrix.language }})
    # As tags só disparam o Swift
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, ruby]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  swift:
    name: Analyze (swift)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER != '' && !github.event.pull_request.head.repo.fork && (vars.SELF_HOSTED_AUTHORS == '' || (contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.triggering_actor)) && contains(format(',{0},', vars.SELF_HOSTED_AUTHORS), format(',{0},', github.event.pull_request.user.login || github.triggering_actor)))) && vars.CI_RUNNER || '"macos-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
