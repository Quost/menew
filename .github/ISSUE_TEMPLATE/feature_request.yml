name: 💡 Idea or feature request
description: Suggest something that would make Menew better
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Menew to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
      description: The problem behind the idea. This helps find the best solution.
  - type: input
    id: version
    attributes:
      label: Menew version
